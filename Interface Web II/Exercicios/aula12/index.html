<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <button id="btn-portal">Abrir Portal (fetch API)</button>

    <div id="loader" class="hidden">
        <div class="portal-loader"></div>
        <p>Carregando...</p>
    </div>

    <div id="cards-container">
        <!-- Os cards dos personagens aparecerão aqui -->
        <div id="div-resultado-top"> 
            <p>Resultado da API aparecerá aqui.</p>
        </div>

        <div id="div-resultado-button">
            <p>Resultado do botão aparecerá aqui.</p>
        </div>    
    </div>
    <script src="script_paulo.js"></script>
</body>
</html>
